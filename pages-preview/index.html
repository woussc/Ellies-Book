<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static entry for the GitHub Pages preview. This is a plain client SPA
      shell. It mounts the existing "use client" workbench; there is no SSR,
      no Worker, and no /api/sync on Pages. The cloud-sync affordance fails
      safe to local-only (see entry-client.tsx).
    -->

    <meta
      name="description"
      content="Static GitHub Pages preview of Ellie's Book. Local-first workbench; cloud backup is not reachable on this preview."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./entry-client.tsx"></script>
  </body>
</html>
